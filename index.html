<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Human Resources</title>
    <link rel="icon" type="image/png" href="/HumanResourcesLowPoly/assets/human-resources-favicon.png" />

    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1712; }
      canvas { display: block; }
      /* Dropped clear of the HUD band's left end cap, which reaches down to y≈48 at the
         centre-left of the screen and was overprinting the first lines of diagnostics. */
      #overlay {
        position: fixed;
        top: 56px;
        left: 12px;
        padding: 40px 14px 10px;
        font: 12px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace;
        color: #d8e8dc;
        background: rgba(12, 20, 16, 0.72);
        border: 1px solid rgba(120, 230, 180, 0.35);
        border-radius: 4px;
        box-sizing: border-box;
        max-height: calc(100vh - 68px);
        overflow-y: auto;
        pointer-events: auto;
        user-select: none;
      }
      #overlay b { color: #6ee7a8; font-weight: 600; }
      #overlay-content { font: inherit; }
      .overlay-heading { margin-bottom: 7px; white-space: pre; }
      .overlay-tabs { position: absolute; top: 6px; left: 36px; display: flex; gap: 4px; white-space: nowrap; }
      .overlay-tab {
        box-sizing: border-box;
        height: 26px;
        padding: 3px 6px;
        border: 1px solid rgba(120, 230, 180, 0.35);
        border-radius: 3px;
        color: #a7bfaf;
        background: rgba(25, 48, 37, 0.55);
        font: 12px/18px ui-monospace, "Cascadia Mono", Consolas, monospace;
        cursor: pointer;
      }
      .overlay-tab[aria-selected='true'] { color: #6ee7a8; border-color: rgba(110, 231, 168, 0.8); background: rgba(25, 68, 47, 0.9); }
      .overlay-tab:hover, .overlay-tab:focus-visible { color: #d8e8dc; border-color: #6ee7a8; outline: none; }
      .overlay-readout { margin: 0; font: inherit; white-space: pre; }
      #overlay-toggle {
        position: absolute;
        top: 6px;
        left: 6px;
        width: 26px;
        height: 26px;
        padding: 0;
        border: 1px solid rgba(120, 230, 180, 0.55);
        border-radius: 3px;
        color: #d8e8dc;
        background: rgba(25, 48, 37, 0.9);
        font: 600 16px/22px ui-monospace, "Cascadia Mono", Consolas, monospace;
        cursor: pointer;
        pointer-events: auto;
      }
      #overlay-toggle:hover, #overlay-toggle:focus-visible {
        color: #6ee7a8;
        border-color: #6ee7a8;
        outline: none;
      }
      #overlay.minimized { width: 40px; height: 40px; padding: 0; }
      #overlay.minimized #overlay-content { display: none; }

      /* Box-selection rectangle. Screen-space furniture, so it is a DOM element rather than
         scene geometry — it stays pixel-crisp and costs no extra render pass. */
      #selectbox {
        position: fixed;
        display: none;
        border: 1px solid #7fe3b0;
        background: rgba(127, 227, 176, 0.14);
        pointer-events: none;
      }
    </style>
    <script type="module" crossorigin src="/HumanResourcesLowPoly/assets/index-BQbW4kIs.js"></script>
    <link rel="modulepreload" crossorigin href="/HumanResourcesLowPoly/assets/three.core-DG6I5xW6.js">
    <link rel="modulepreload" crossorigin href="/HumanResourcesLowPoly/assets/SkeletonUtils-CHxfGqZJ.js">
    <link rel="modulepreload" crossorigin href="/HumanResourcesLowPoly/assets/toon-DLr-bRAE.js">
  </head>
  <body>
    <div id="overlay" class="minimized">
      <button id="overlay-toggle" type="button" aria-expanded="false" aria-controls="overlay-content" title="Restore developer panel">+</button>
      <div id="overlay-content"></div>
    </div>
    <div id="selectbox"></div>
  </body>
</html>
