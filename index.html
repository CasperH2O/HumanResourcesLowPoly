<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Human Resources M4.5</title>
    <link rel="icon" type="image/png" href="/assets/human-resources-favicon.png" />

    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1712; }
      canvas { display: block; }
      /* Dropped clear of the HUD band's left end cap, which reaches down to y≈48 at the
         centre-left of the screen and was overprinting the first lines of diagnostics. */
      #overlay {
        position: fixed;
        top: 56px;
        left: 12px;
        padding: 34px 14px 10px;
        font: 12px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace;
        color: #d8e8dc;
        background: rgba(12, 20, 16, 0.72);
        border: 1px solid rgba(120, 230, 180, 0.35);
        border-radius: 4px;
        box-sizing: border-box;
        max-height: calc(100vh - 68px);
        overflow-y: auto;
        pointer-events: auto;
        user-select: none;
      }
      #overlay b { color: #6ee7a8; font-weight: 600; }
      #overlay-content { margin: 0; font: inherit; white-space: pre; }
      #overlay-toggle {
        position: absolute;
        top: 6px;
        left: 6px;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 1px solid rgba(120, 230, 180, 0.55);
        border-radius: 3px;
        color: #d8e8dc;
        background: rgba(25, 48, 37, 0.9);
        font: 600 16px/18px ui-monospace, "Cascadia Mono", Consolas, monospace;
        cursor: pointer;
        pointer-events: auto;
      }
      #overlay-toggle:hover, #overlay-toggle:focus-visible {
        color: #6ee7a8;
        border-color: #6ee7a8;
        outline: none;
      }
      #overlay.minimized { width: 34px; height: 34px; padding: 0; }
      #overlay.minimized #overlay-content { display: none; }

      /* Box-selection rectangle. Screen-space furniture, so it is a DOM element rather than
         scene geometry — it stays pixel-crisp and costs no extra render pass. */
      #selectbox {
        position: fixed;
        display: none;
        border: 1px solid #7fe3b0;
        background: rgba(127, 227, 176, 0.14);
        pointer-events: none;
      }
    </style>
    <script type="module" crossorigin src="/HumanResourcesLowPoly/assets/index-FDRaQ35W.js"></script>
  </head>
  <body>
    <div id="overlay" class="minimized">
      <button id="overlay-toggle" type="button" aria-expanded="false" aria-controls="overlay-content" title="Restore developer panel">+</button>
      <pre id="overlay-content"></pre>
    </div>
    <div id="selectbox"></div>
  </body>
</html>
